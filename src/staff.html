<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>店舗管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <h1>店舗管理</h1>
  <select id="store" aria-label="店舗"></select>
</header>
<main>
  <p class="note">この画面に「支払済」と表示された注文だけ商品をお渡しください。お客様の画面の受取番号と照合し、渡したら「受け渡し完了」を押します。</p>
  <p id="error" class="error" hidden></p>

  <h2>支払済・未受け渡し <span id="count" class="badge">0</span></h2>
  <div id="paid"></div>

  <h2>最近の履歴</h2>
  <div id="done"></div>

  <h2 id="form-title">商品を登録</h2>
  <form id="product-form" class="card form">
    <label>商品名<input id="p-name" required maxlength="60" autocomplete="off"></label>
    <label>価格（税込・円）<input id="p-price" type="number" inputmode="numeric" required min="50" max="1000000" step="1"></label>
    <label>税率
      <select id="p-tax">
        <option value="10">10%（標準）</option>
        <option value="8">8%（軽減税率：持ち帰りの飲食料品など）</option>
      </select>
    </label>
    <div class="actions"><button id="p-submit" class="primary">登録する</button><button id="p-cancel" type="button" class="ghost" hidden>キャンセル</button></div>
    <p id="product-error" class="error" hidden></p>
  </form>

  <h2>商品一覧 <span id="product-count" class="badge">0</span></h2>
  <p class="note">QR コードを印刷して商品や売り場に貼ってください。お客様が読み取ると、その商品がカートに入ります。「無効」にした商品は読み取ってもカートに入りません。</p>
  <div id="products"></div>

  <h2>店舗の QR コード（入口用）</h2>
  <p><a id="qr-link" href="#" target="_blank" rel="noopener"><img id="qr" alt="店舗QRコード" width="220" height="220"></a></p>
  <p class="note">お客様がこの QR を読み取ると注文画面（カート）が開きます。クリックで印刷用に開きます。</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const yen = (n) => '¥' + n.toLocaleString('ja-JP');
const time = (s) => s ? new Date(s).toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' }) : '';
const no = (n) => n == null ? '---' : String(n).padStart(3, '0');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}

function card(o) {
  const c = el('div', 'order ' + o.status);
  const head = el('div', 'order-head');
  head.append(el('span', 'pickup', no(o.pickupNo)));
  const label = { paid: '支払済 ' + time(o.paidAt), handed_over: '受け渡し済 ' + time(o.handedOverAt), refunded: '返金済 ' + time(o.refundedAt) }[o.status];
  head.append(el('span', 'status', label), el('span', 'total', yen(o.total)));
  c.append(head);
  const ul = el('ul');
  for (const i of o.items) ul.append(el('li', null, i.name + ' × ' + i.qty));
  c.append(ul);
  const actions = el('div', 'actions');
  if (o.status === 'paid') {
    const b = el('button', 'primary', '受け渡し完了');
    b.onclick = () => act(b, o.id, 'handover');
    actions.append(b);
  }
  if (o.status !== 'refunded') {
    const r = el('button', 'ghost', '返金');
    r.onclick = () => {
      if (confirm('受取番号 ' + no(o.pickupNo) + '（' + yen(o.total) + '）を全額返金します。取り消せません。よろしいですか？')) act(r, o.id, 'refund');
    };
    actions.append(r);
  }
  c.append(actions);
  return c;
}

async function act(btn, id, action) {
  btn.disabled = true;
  try {
    await api('/api/staff/orders/' + id + '/' + action, { method: 'POST' });
  } catch (e) {
    alert('処理できませんでした（' + e.message + '）。一覧を確認してください。');
  }
  await refresh();
}

async function refresh() {
  const store = $('store').value;
  if (!store) return;
  try {
    const { orders } = await api('/api/staff/orders?store=' + encodeURIComponent(store));
    const paid = orders.filter((o) => o.status === 'paid');
    const done = orders.filter((o) => o.status !== 'paid');
    $('count').textContent = paid.length;
    $('paid').replaceChildren(...(paid.length ? paid.map(card) : [el('p', 'note', '受け渡し待ちの注文はありません。')]));
    $('done').replaceChildren(...(done.length ? done.map(card) : [el('p', 'note', '履歴はありません。')]));
    $('error').hidden = true;
  } catch (e) {
    $('error').textContent = '注文一覧を取得できません。通信状況を確認してください。';
    $('error').hidden = false;
  }
}

function productCard(p) {
  const c = el('div', 'order product-admin' + (p.available ? '' : ' off'));
  const link = el('a');
  link.href = '/staff/product-qr.svg?id=' + encodeURIComponent(p.id);
  link.target = '_blank';
  link.rel = 'noopener';
  const img = el('img');
  img.src = link.href; img.alt = p.name + ' の QR コード'; img.width = 112; img.height = 112; img.loading = 'lazy';
  link.append(img);
  const info = el('div', 'info');
  info.append(el('div', 'pname', p.name), el('div', 'note', yen(p.price) + '（税込・' + p.taxRate + '%）'));
  info.append(el('div', 'state', p.available ? '有効（販売中）' : '無効（販売停止）'));
  const b = el('button', p.available ? 'ghost' : 'primary', p.available ? '無効にする' : '有効にする');
  b.onclick = async () => {
    b.disabled = true;
    try {
      await api('/api/staff/products/' + encodeURIComponent(p.id) + '/availability', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ available: !p.available }),
      });
    } catch (e) { alert('切り替えできませんでした（' + e.message + '）。'); }
    await loadProducts();
  };
  const edit = el('button', 'ghost', '編集');
  edit.onclick = () => startEdit(p);
  const del = el('button', 'ghost danger', '削除');
  del.onclick = async () => {
    if (!confirm('「' + p.name + '」を削除します。印刷済みの QR コードは使えなくなり、元に戻せません。よろしいですか？')) return;
    del.disabled = true;
    try { await api('/api/staff/products/' + encodeURIComponent(p.id), { method: 'DELETE' }); }
    catch (e) { alert('削除できませんでした（' + e.message + '）。'); }
    if (editingId === p.id) stopEdit();
    await loadProducts();
  };
  const row = el('div', 'actions');
  row.append(b, edit, del);
  info.append(row);
  c.append(link, info);
  return c;
}

async function loadProducts() {
  const store = $('store').value;
  if (!store) return;
  try {
    const { products } = await api('/api/staff/products?store=' + encodeURIComponent(store));
    $('product-count').textContent = products.length;
    $('products').replaceChildren(...(products.length ? products.map(productCard) : [el('p', 'note', '商品はまだ登録されていません。')]));
  } catch (e) {
    $('products').replaceChildren(el('p', 'error', '商品一覧を取得できません。'));
  }
}

let editingId = null;
function startEdit(p) {
  editingId = p.id;
  $('form-title').textContent = '商品を編集';
  $('p-submit').textContent = '保存する';
  $('p-cancel').hidden = false;
  $('p-name').value = p.name;
  $('p-price').value = p.price;
  $('p-tax').value = String(p.taxRate);
  $('product-error').hidden = true;
  $('form-title').scrollIntoView({ behavior: 'smooth' });
  $('p-name').focus({ preventScroll: true });
}
function stopEdit() {
  editingId = null;
  $('form-title').textContent = '商品を登録';
  $('p-submit').textContent = '登録する';
  $('p-cancel').hidden = true;
  $('product-form').reset();
  $('product-error').hidden = true;
}
$('p-cancel').onclick = stopEdit;

$('product-form').onsubmit = async (ev) => {
  ev.preventDefault();
  const btn = $('p-submit');
  btn.disabled = true;
  $('product-error').hidden = true;
  try {
    await api(editingId ? '/api/staff/products/' + encodeURIComponent(editingId) : '/api/staff/products', {
      method: editingId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ storeId: $('store').value, name: $('p-name').value, price: Number($('p-price').value), taxRate: Number($('p-tax').value) }),
    });
    stopEdit();
    await loadProducts();
  } catch (e) {
    $('product-error').textContent = '保存できませんでした。商品名（60文字以内）と価格（50〜1,000,000円の整数）を確認してください。';
    $('product-error').hidden = false;
  }
  btn.disabled = false;
};

function setStore() {
  const s = encodeURIComponent($('store').value);
  $('qr').src = '/staff/qr.svg?store=' + s;
  $('qr-link').href = '/staff/qr.svg?store=' + s;
  stopEdit();
  refresh();
  loadProducts();
}

(async () => {
  const { stores } = await api('/api/staff/stores');
  for (const s of stores) { const o = el('option', null, s.name); o.value = s.id; $('store').append(o); }
  $('store').onchange = setStore;
  setStore();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
