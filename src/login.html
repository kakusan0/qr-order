<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>スタッフログイン</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar"><h1>スタッフログイン</h1></header>
<main>
  <form id="login" class="card form">
    <label>ユーザー名<input id="username" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label>パスワード<input id="password" type="password" required autocomplete="current-password"></label>
    <button class="primary">ログイン</button>
    <p id="error" class="error" role="alert" hidden></p>
  </form>
</main>
<script>
document.getElementById('login').onsubmit = async (ev) => {
  ev.preventDefault();
  const btn = ev.target.querySelector('button'), err = document.getElementById('error');
  btn.disabled = true; err.hidden = true;
  try {
    const res = await fetch('/api/staff/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }),
    });
    if (res.ok) { location.href = '/staff'; return; }
    err.textContent = res.status === 429
      ? 'ログインの試行回数が多すぎます。15分ほど待ってからやり直してください。'
      : 'ユーザー名またはパスワードが違います。';
  } catch {
    err.textContent = '通信できませんでした。もう一度お試しください。';
  }
  err.hidden = false; btn.disabled = false;
};
</script>
</body>
</html>
